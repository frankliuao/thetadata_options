[project]
name = "thetadata-options"
version = "0.1.0"
description = "Production-grade historical options, Greeks, and open interest pipeline for ThetaData v3 and Polars Parquet lakehouses"
license = "MIT"
authors = [
    {name = "Ao Liu", email = "frankliuao@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "thetadata (>=1.0.16,<2.0.0)",
    "polars (>=2.1.0,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "tenacity (>=9.2.1,<10.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "yfinance (>=0.2.40,<1.0.0)"
]

[project.urls]
Homepage = "https://github.com/frankliuao/thetadata_options"
Repository = "https://github.com/frankliuao/thetadata_options"

[project.scripts]
download-options = "options_data.cli:main"
update-options = "options_data.updater:main"
options-viewer = "options_data.viewer:main"

[tool.poetry]
packages = [{include = "options_data", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
